services:

  mysql:
    image: mysql:8.0
    container_name: employee-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  backend:
    image: employee-backend:1.0
    container_name: employee-backend-container

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/employee_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "8081:8081"

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped


  frontend:
    image: employee-frontend:1.0
    container_name: employee-frontend-container

    ports:
      - "4200:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  mysql-data: